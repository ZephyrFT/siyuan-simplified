name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MinGW-w64 to PATH
        shell: pwsh
        run: echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install pnpm
        run: npm install --global pnpm@12.6.0

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match app/package.json version $version"
          }

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        working-directory: app
        run: node node_modules/electron/install.js

      - name: Build frontend bundles
        working-directory: app
        run: pnpm run build

      - name: Prepare OCR runtime and models
        run: python scripts/prepare-ocr.py --runtime windows-amd64

      - name: Build Windows kernel
        working-directory: kernel
        env:
          CGO_ENABLED: 1
          CC: gcc
          GOOS: windows
          GOARCH: amd64
        run: go build -tags "fts5 sqlcipher" -ldflags "-s -w" -o ../app/kernel/SiYuan-Kernel.exe .

      - name: Build installer
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm exec electron-builder --config electron-builder.yml --publish=never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SiYuan Simplified ${{ github.ref_name }}
          files: app/build/siyuan-simplified-*-win.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
